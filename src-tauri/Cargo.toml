[package]
name = "jianji"
version = "0.1.0"
description = "简记 Android 端 - 个人记账"
edition = "2021"

[lib]
name = "jianji_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# debug APK 去掉符号，避免单包体积过大（不影响运行与日志）
[profile.dev]
strip = "symbols"
